<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Библиотека{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0 auto; max-width: 1100px; padding: 0 16px 40px; color: #222; }
    header { display: flex; gap: 18px; align-items: center; padding: 12px 0; border-bottom: 1px solid #ccc; margin-bottom: 16px; }
    header .who { margin-left: auto; color: #666; font-size: 14px; }
    table { border-collapse: collapse; width: 100%; margin: 8px 0 16px; }
    th, td { border: 1px solid #ddd; padding: 4px 8px; text-align: left; font-size: 14px; }
    th { background: #f3f3f3; }
    form.inline { display: inline; }
    .filters, .action { background: #f7f7f7; padding: 10px; margin-bottom: 12px; }
    .overdue { color: #b00020; font-weight: 600; }
    .returned { color: #777; }
    .error { background: #fde8e8; border: 1px solid #f5b5b5; padding: 8px 12px; margin-bottom: 12px; }
    .stats span { display: inline-block; margin-right: 24px; }
    .pager a, .pager span { margin-right: 10px; }
    footer { margin-top: 32px; color: #999; font-size: 12px; }
  </style>
</head>
<body>
  {% if account %}
  <header>
    <a href="/loans">Выдачи</a>
    <a href="/readers">Читатели</a>
    <a href="/books">Книги</a>
    <a href="/summary">Сводка</a>
    <span class="who">{{ account.full_name }} ({{ account.login }})</span>
    <form class="inline" method="post" action="/logout"><button>Выйти</button></form>
  </header>
  {% endif %}
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  {% block content %}{% endblock %}
  <footer>aleksandr_alekseenko · выдача книг</footer>
</body>
</html>
