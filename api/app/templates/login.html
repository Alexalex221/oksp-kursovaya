{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<h1>Вход в библиотеку</h1>
<form method="post" action="/login">
  <p><label>Логин <input name="login" value="{{ login or '' }}" autofocus></label></p>
  <p><label>Пароль <input name="password" type="password"></label></p>
  <p><button>Войти</button></p>
</form>
{% endblock %}
